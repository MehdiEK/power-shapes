[project]
name = "power-shapes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MehdiEK", email = "elkansoulimehdi@yahoo.fr" }
]
requires-python = ">=3.9"
dependencies = [
    "gudhi>=3.11.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
]

[project.scripts]
power-shapes = "power_shapes:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
notebook = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
]
